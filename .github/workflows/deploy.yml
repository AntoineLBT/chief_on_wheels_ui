name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-ui
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/antoinelbt/chief_on_wheels_ui # GHCR names must be lowercase

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run # npm test runs Vitest in watch mode
      - run: npm run build # vue-tsc type check + vite build

  build:
    needs: test
    # VITE_API_BASE_URL is baked into the bundle: no image without it.
    if: vars.API_BASE_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Node stage runs on the runner's platform ($BUILDPLATFORM); the
      # arm64 Caddy stage only copies files, so no QEMU is needed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: VITE_API_BASE_URL=${{ vars.API_BASE_URL }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Skipped until the server exists (repository variable DEPLOY_SSH_HOST).
    if: vars.DEPLOY_SSH_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          HOST: ${{ vars.DEPLOY_SSH_HOST }}
        run: |
          ssh "deploy@$HOST" bash -s -- "$GITHUB_SHA" <<'EOF'
          set -euo pipefail
          cd /opt/chief_on_wheels
          export UI_TAG="$1"
          docker compose pull ui
          docker compose up -d ui
          sed -i "s/^UI_TAG=.*/UI_TAG=$UI_TAG/" .env
          docker image prune -f
          EOF
